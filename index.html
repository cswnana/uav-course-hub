<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程互动入口</title>
<style>
  :root{--bg:#F5F0E8;--ink:#2C2416;--muted:#6B5E4E;--accent:#C45C3E;--accent2:#9A3F28;--card:#FFFCFA;--line:#E5D9C8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:28px 20px 8px;max-width:880px;margin:0 auto}
  header h1{margin:0 0 6px;font-size:1.65rem}
  header p{margin:0;color:var(--muted);line-height:1.5}
  .warn{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff3cd;color:#6a4b00;font-size:.92rem}
  main{max-width:880px;margin:0 auto;padding:12px 20px 48px}
  section{margin:22px 0}
  section h2{margin:0 0 12px;font-size:1.05rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  a.card:hover{border-color:var(--accent)}
  a.card strong{display:block;font-size:1.05rem;margin-bottom:4px}
  a.card span{display:block;font-size:.86rem;color:var(--muted);line-height:1.4}
  footer{max-width:880px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.85rem;line-height:1.5}
  code{background:#efe6d8;padding:1px 6px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>无人机导论与飞行法规 · 互动入口</h1>
  <p>点一个开一个。三维页必须经本机服务打开；在线版可直接点开；课堂投屏也可用本机「打开课程互动.bat」。</p>
  <div class="warn" id="protoWarn" hidden>当前不是 http://127.0.0.1 —— 三维模型可能加载失败。请双击「打开课程互动.bat」再进本页。</div>
</header>
<main id="app"><p style="color:#6B5E4E">清单加载中…</p></main>
<footer>
  以后加互动页：编辑课程根目录 <code>hub-catalog.json</code>，在对应分组的 <code>items</code> 里加一条 <code>label / note / path</code>，刷新本页即可。<br>
  路径相对课程根目录，勿用 file:// 双击 HTML。
</footer>
<script>
(function () {
  if (location.protocol !== "http:" || location.hostname !== "127.0.0.1") {
    document.getElementById("protoWarn").hidden = false;
  }
  function render(data) {
    if (data.title) document.querySelector("header h1").textContent = data.title;
    var app = document.getElementById("app");
    app.innerHTML = "";
    (data.groups || []).forEach(function (g) {
      var sec = document.createElement("section");
      var h = document.createElement("h2");
      h.textContent = g.name;
      sec.appendChild(h);
      var grid = document.createElement("div");
      grid.className = "grid";
      (g.items || []).forEach(function (it) {
        var a = document.createElement("a");
        a.className = "card";
        a.href = "/" + String(it.path || "").replace(/^\/+/, "");
        a.target = "_blank";
        a.rel = "noopener";
        a.innerHTML = "<strong></strong><span></span>";
        a.querySelector("strong").textContent = it.label || it.id;
        a.querySelector("span").textContent = it.note || it.path || "";
        grid.appendChild(a);
      });
      sec.appendChild(grid);
      app.appendChild(sec);
    });
  }
  fetch("/hub-catalog.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function (e) {
      document.getElementById("app").innerHTML = "<p>清单加载失败：" + e + "。请确认本页地址是 http://127.0.0.1:8765/hub.html</p>";
    });
})();
</script>
</body>
</html>
